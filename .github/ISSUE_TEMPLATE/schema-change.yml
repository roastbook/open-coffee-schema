name: Propose a schema change
description: Add, change or remove a field, value or rule in the Open Coffee standard.
title: "schema: "
labels: ["schema-change"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping shape the standard. To add or correct a café, equipment or brew method, use the [data repository](https://github.com/Roastbook/open-coffee-data/issues/new/choose) instead.
  - type: dropdown
    id: family
    attributes:
      label: Schema family
      options: [coffee-places, equipment, brew-methods, sources, translations, common, JSON-LD context, other]
    validations: { required: true }
  - type: textarea
    id: fact
    attributes:
      label: What real-world fact should the standard record?
      description: In plain language. Who needs it, and what would they do with it?
    validations: { required: true }
  - type: textarea
    id: shape
    attributes:
      label: Proposed field and example value
      description: Field path (for example `amenities.power_outlets`), type, allowed values, and one example record snippet.
      render: json
    validations: { required: true }
  - type: textarea
    id: sources
    attributes:
      label: Where would the values come from?
      description: Which allow-listed sources (or new ones) provide this fact? No Google Maps, OpenStreetMap or closed guides.
    validations: { required: true }
  - type: dropdown
    id: bump
    attributes:
      label: Expected version bump
      description: New optional field = minor. Removing or tightening anything = major. Wording only = patch.
      options: [minor (additive, optional), major (breaking), patch (wording only), not sure]
    validations: { required: true }
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues and discussions.
          required: true
        - label: I will sign off my commits (DCO) if I open a pull request.
          required: true
