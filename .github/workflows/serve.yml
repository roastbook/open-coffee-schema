name: Roastbook · 🫖 Serve (deploy)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build site
    permissions:
      contents: read
    uses: Roastbook/workflows/.github/workflows/site-build.yml@815757c2a70eaef9ce3cf8d4cf814c66ded83ca4 # main

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: Roastbook/workflows/.github/workflows/pages-deploy.yml@815757c2a70eaef9ce3cf8d4cf814c66ded83ca4 # main
