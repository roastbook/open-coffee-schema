name: Roastbook · 🫖 Serve (deploy)

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build site
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/site-build.yml@baecffcb84dd5587b8cb91f64e09392e678704ae # main

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: Roastbook/workflows/.github/workflows/pages-deploy.yml@baecffcb84dd5587b8cb91f64e09392e678704ae # main
