# @orcastrate
# template: open-coffee/deploy
# params:
#   kind: schema
# @end-orcastrate

name: Deploy

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions: {}

jobs:
  build:
    name: Build site
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/site-build.yml@15adb52d8c9422ab24409caecc406fa265f81ce7 # main

  deploy:
    name: Deploy
    needs: build
    permissions:
      pages: write
      id-token: write
    uses: Roastbook/workflows/.github/workflows/pages-deploy.yml@15adb52d8c9422ab24409caecc406fa265f81ce7 # main
