name: Roastbook · 🔥 Roast (build)

on:
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: roast-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build site preview
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/site-build.yml@baecffcb84dd5587b8cb91f64e09392e678704ae # main
