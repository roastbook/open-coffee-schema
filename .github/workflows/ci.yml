name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/schema-validate.yml@7c716b16de05cc8c9cb80cdd907bf6a87587b1b5 # main
