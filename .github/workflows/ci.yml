# @orcastrate
# template: open-coffee/ci
# params:
#   kind: schema
# @end-orcastrate

name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  # Every push to main keeps its run: Release requires a successful push run for its commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/schema-validate.yml@15adb52d8c9422ab24409caecc406fa265f81ce7 # main
