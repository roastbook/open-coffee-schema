name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    permissions:
      contents: read
      packages: read
    uses: Roastbook/workflows/.github/workflows/schema-validate.yml@24c0af08d419c4c214e9dd3b5dc0b3389dc88e86 # main
