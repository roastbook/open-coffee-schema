# @orcastrate
# template: open-coffee/resting
# params:
#   kind: schema
#   site_url: https://schema.roastbook.coffee/
#   smoke_paths:
#     - coffee-places/coffee-places.schema.latest.json
#     - coffee-places/latest/
# @end-orcastrate

name: Roastbook · ⏳ Resting (link and smoke checks)

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: resting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Link and smoke checks
    permissions:
      contents: read
    uses: Roastbook/workflows/.github/workflows/link-check.yml@815757c2a70eaef9ce3cf8d4cf814c66ded83ca4 # main
    with:
      link_check: false
      smoke_urls: >-
        https://schema.roastbook.coffee/
        https://schema.roastbook.coffee/coffee-places/coffee-places.schema.latest.json
        https://schema.roastbook.coffee/coffee-places/latest/
