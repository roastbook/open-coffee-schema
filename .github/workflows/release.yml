# @end-orcastrate

name: Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump from Conventional Commits or an explicit override
        required: true
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: write
      actions: read
      id-token: write
      packages: write
    uses: Roastbook/workflows/.github/workflows/release.yml@15adb52d8c9422ab24409caecc406fa265f81ce7 # main
    with:
      bump_type: ${{ inputs.bump_type }}
      ci_workflow: ci.yml
      node_setup: true
      assets_command: 'bash scripts/release-assets.sh "$TAG"'
      npm_publish: true
      npm_package_dirs: 'release/npm'
      npm_registry: 'https://registry.npmjs.org'
      dispatch_repository: open-coffee-data
      dispatch_event: schema-released
    secrets:
      RELEASER_APP_ID: ${{ secrets.RELEASER_APP_ID }}
      RELEASER_APP_PRIVATE_KEY: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}
