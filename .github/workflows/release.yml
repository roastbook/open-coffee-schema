#   node_setup: true
#   assets_command: bash scripts/release-assets.sh "$TAG"
#   npm_publish: true
#   npm_package_dirs: release/npm release/npm-ui
#   dispatch_repository: open-coffee-data
#   dispatch_event: schema-released
# @end-orcastrate

name: Roastbook · 🫘 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump from Conventional Commits or an explicit override
        required: true
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: read
      actions: read
      packages: write
    uses: Roastbook/workflows/.github/workflows/release.yml@baecffcb84dd5587b8cb91f64e09392e678704ae # main
    with:
      bump_type: ${{ inputs.bump_type }}
      ci_workflow: cupping.yml
      node_setup: true
      assets_command: bash scripts/release-assets.sh "$TAG"
      npm_publish: true
      npm_package_dirs: release/npm release/npm-ui
      dispatch_repository: open-coffee-data
      dispatch_event: schema-released
    secrets: inherit
