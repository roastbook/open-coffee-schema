# @orcastrate
# template: common/release
# params:
#   ci_workflow: cupping.yml
#   node_setup: true
#   assets_command: bash scripts/release-assets.sh "$TAG"
#   npm_publish: true
#   dispatch_repository: open-coffee-data
#   dispatch_event: schema-released
# @end-orcastrate

name: Roastbook · 🫘 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Version bump from Conventional Commits or an explicit override
        required: true
        type: choice
        default: auto
        options: [auto, patch, minor, major]

permissions: {}

jobs:
  release:
    name: Release
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Roastbook/workflows/.github/workflows/release.yml@3fef09ed6f5c71c190a27ece5378697dbf76e8cb # main
    with:
      bump_type: ${{ inputs.bump_type }}
      ci_workflow: cupping.yml
      node_setup: true
      assets_command: bash scripts/release-assets.sh "$TAG"
      # Turn on with the NPM_PUBLISH_ENABLED variable once the npm trusted publisher exists.
      npm_publish: ${{ vars.NPM_PUBLISH_ENABLED == 'true' }}
      dispatch_repository: open-coffee-data
      dispatch_event: schema-released
    secrets: inherit
