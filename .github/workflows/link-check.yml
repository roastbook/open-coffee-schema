# @orcastrate
# template: open-coffee/link-check
# params:
#   kind: schema
#   site_url: https://schema.roastbook.coffee/
#   smoke_paths:
#     - coffee-places/coffee-places.schema.latest.json
#     - coffee-places/latest/
# @end-orcastrate

name: Link check

on:
  schedule:
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: link-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Link and smoke checks
    permissions:
      contents: read
    uses: Roastbook/workflows/.github/workflows/link-check.yml@7c716b16de05cc8c9cb80cdd907bf6a87587b1b5 # main
    with:
      link_check: false
      smoke_urls: >-
        https://schema.roastbook.coffee/
        https://schema.roastbook.coffee/coffee-places/coffee-places.schema.latest.json
        https://schema.roastbook.coffee/coffee-places/latest/
